name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_common.txt
            requirements_dev.txt
            requirements_lint.txt

      - name: Install dependencies
        run: scripts/setup

      - name: Verify release version
        shell: bash
        run: |
          manifest_version="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("custom_components/weather_platform/manifest.json").read_text(encoding="utf-8"))["version"])')"
          expected_tag="v${manifest_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match manifest version ${manifest_version}."
            echo "Expected tag: ${expected_tag}"
            exit 1
          fi

      - name: Lint
        run: scripts/lint

      - name: Test
        run: scripts/test

      - name: Build manual-install package
        shell: bash
        run: |
          mkdir -p dist/custom_components
          cp -R custom_components/weather_platform dist/custom_components/
          cd dist
          zip -r weather-platform-home-assistant.zip custom_components/weather_platform

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/weather-platform-home-assistant.zip#Weather Platform Home Assistant" \
            --generate-notes \
            --title "Weather Platform ${GITHUB_REF_NAME}" \
            --verify-tag
